version: '3.8'

services:
  # 1. Chat Persistence (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Caching Storage (Redis)
  redis:
    image: redis:7-alpine
    networks:
      - rag_net

  # 3. Vector DB (Qdrant) - Sesuai request "Existing", tapi kita include agar jalan
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_net

  # 4. Inference Engine (vLLM)
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia # WAJIB NVIDIA RUNTIME
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Jumlah GPU
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=<YOUR_HF_TOKEN_IF_NEEDED>
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: --model ${VLLM_MODEL_NAME} --gpu-memory-utilization 0.85 --max-model-len 4096
    ports:
      - "8000:8000"
    networks:
      - rag_net

  # 5. Frontend & Logic (Chainlit + LangChain)
  app:
    build: ./app
    ports:
      - "8080:8000"
    environment:
      - HOST=0.0.0.0
      - LISTEN_PORT=8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      vllm:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./app:/app
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface # Cache model embedding biar tidak download ulang
    networks:
      - rag_net
    command: chainlit run app.py -w

volumes:
  postgres_data:
  qdrant_data:

networks:
  rag_net:
    driver: bridge